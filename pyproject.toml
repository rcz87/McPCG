[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coinglass-mcp"
version = "1.0.0"
description = "CoinGlass MCP Server for crypto derivatives analytics — optimized for Ricoz Scalping Framework"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastmcp>=3.1.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[project.scripts]
coinglass-mcp = "coinglass_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coinglass_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
